name: cron

on:
  push:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  hello:
    runs-on: ubuntu-latest
    # The OpenRouter key is stored as an environment secret, so the job
    # must declare the environment to see it.
    environment: OPENROUTER_API_KEY
    steps:
      - run: echo "hello world"

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - run: npm install -g @anthropic-ai/claude-code

      - run: claude --version

      - name: Ask Claude Code via OpenRouter and echo the reply
        env:
          ANTHROPIC_BASE_URL: https://openrouter.ai/api/v1
          ANTHROPIC_AUTH_TOKEN: ${{ secrets.OPENROUTER_API_KEY }}
          ANTHROPIC_MODEL: z-ai/glm-5.2:free
          DIAG_SAME_NAME_VARIABLE: ${{ vars.OPENROUTER_API_KEY }}
        run: |
          echo "secret   OPENROUTER_API_KEY length: ${#ANTHROPIC_AUTH_TOKEN}"
          echo "variable OPENROUTER_API_KEY length: ${#DIAG_SAME_NAME_VARIABLE}"
          case "$ANTHROPIC_AUTH_TOKEN" in
            sk-or-*) echo "prefix: looks like an OpenRouter key" ;;
            "")      echo "prefix: empty" ;;
            *)       echo "prefix: NOT sk-or- (wrong key type?)" ;;
          esac
          if [ -z "$ANTHROPIC_AUTH_TOKEN" ]; then
            echo "::error::OPENROUTER_API_KEY secret is not set"
            exit 1
          fi
          reply=$(claude -p 'Reply with exactly one short sentence saying hello.' --output-format text)
          echo "=== model reply ==="
          echo "$reply"

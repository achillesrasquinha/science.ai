name: cron

on:
  push:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  OPENROUTER_MODEL: nvidia/nemotron-3-ultra-550b-a55b:free
  OPENROUTER_MODEL_CONTEXT: '1000000'

jobs:
  hello:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Echo hello world
        run: echo "hello world"

      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code

      - name: Report Claude Code version
        run: claude --version

      - name: Map the OpenRouter model into Claude Code's catalog
        run: |
          mkdir -p ~/.claude
          jq -n --arg model "$OPENROUTER_MODEL" '{
            modelPicker: {
              options: [
                { model: $model, label: "OpenRouter free", behavesAs: "sonnet" }
              ]
            }
          }' > ~/.claude/settings.json

      - name: Ask Claude Code via OpenRouter
        env:
          # Claude Code appends /v1/messages, so this must not end in /v1.
          ANTHROPIC_BASE_URL: https://openrouter.ai/api
          ANTHROPIC_AUTH_TOKEN: ${{ secrets.OPENROUTER_API_KEY }}
          ANTHROPIC_API_KEY: ''
          ANTHROPIC_MODEL: ${{ env.OPENROUTER_MODEL }}
          CLAUDE_CODE_MAX_CONTEXT_TOKENS: ${{ env.OPENROUTER_MODEL_CONTEXT }}
        run: |
          if [ -z "$ANTHROPIC_AUTH_TOKEN" ]; then
            echo "::error::OPENROUTER_API_KEY secret is not set"
            exit 1
          fi
          claude -p 'Reply with exactly one short sentence saying hello.' --output-format text

      - name: Run the hypothesis-engine skill for systems biology
        env:
          ANTHROPIC_BASE_URL: https://openrouter.ai/api
          ANTHROPIC_AUTH_TOKEN: ${{ secrets.OPENROUTER_API_KEY }}
          ANTHROPIC_API_KEY: ''
          ANTHROPIC_MODEL: ${{ env.OPENROUTER_MODEL }}
          CLAUDE_CODE_MAX_CONTEXT_TOKENS: ${{ env.OPENROUTER_MODEL_CONTEXT }}
        run: |
          ls -1 .claude/skills
          claude -p '/hypothesis-engine systems biology' \
            --output-format text \
            --dangerously-skip-permissions

name: cron

on:
  push:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  hello:
    runs-on: ubuntu-latest
    steps:
      - run: echo "hello world"

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - run: npm install -g @anthropic-ai/claude-code

      - run: claude --version

      - name: Ask Claude Code via OpenRouter and echo the reply
        env:
          # Claude Code appends /v1/messages itself — do not include /v1 here.
          ANTHROPIC_BASE_URL: https://openrouter.ai/api
          ANTHROPIC_AUTH_TOKEN: ${{ secrets.OPENROUTER_API_KEY }}
          # Must be explicitly empty, or Claude Code may fall back to Anthropic directly.
          ANTHROPIC_API_KEY: ""
          ANTHROPIC_MODEL: nvidia/nemotron-3-ultra-550b-a55b:free
          # This model is not in Claude Code's catalog, so declare its real window.
          CLAUDE_CODE_MAX_CONTEXT_TOKENS: '1000000'
        run: |
          if [ -z "$ANTHROPIC_AUTH_TOKEN" ]; then
            echo "::error::OPENROUTER_API_KEY secret is not set"
            exit 1
          fi

          # Map the unknown provider id onto a known model shape.
          mkdir -p ~/.claude
          cat > ~/.claude/settings.json <<'JSON'
          {
            "modelPicker": {
              "options": [
                {
                  "model": "nvidia/nemotron-3-ultra-550b-a55b:free",
                  "label": "Nemotron 3 Ultra (free)",
                  "behavesAs": "sonnet"
                }
              ]
            }
          }
          JSON

          reply=$(claude -p 'Reply with exactly one short sentence saying hello.' --output-format text)
          echo "=== model reply ==="
          echo "$reply"

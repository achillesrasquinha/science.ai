name: cron

on:
  push:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
    inputs:
      topic:
        description: Topic to generate hypotheses for
        type: string
        default: systems biology

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

env:
  NODE_VERSION: '22'
  MCP_REPO: https://github.com/achillesrasquinha/biorouter.git
  TOPIC: ${{ inputs.topic || 'systems biology' }}

jobs:
  hypothesis:
    name: hypothesis-engine
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # Claude Code appends /v1/messages, so this must not end in /v1.
      ANTHROPIC_BASE_URL: https://openrouter.ai/api
      ANTHROPIC_AUTH_TOKEN: ${{ secrets.OPENROUTER_API_KEY }}
      ANTHROPIC_API_KEY: ''
      ANTHROPIC_MODEL: nvidia/nemotron-3-ultra-550b-a55b:free
      CLAUDE_CODE_MAX_CONTEXT_TOKENS: '1000000'
    steps:
      - name: Verify the OpenRouter secret is present
        run: |
          if [[ -z "$ANTHROPIC_AUTH_TOKEN" ]]; then
            echo "::error::OPENROUTER_API_KEY secret is not set"
            exit 1
          fi

      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install Claude Code
        run: |
          npm install -g @anthropic-ai/claude-code
          claude --version

      - name: Map the OpenRouter model into Claude Code's catalog
        run: |
          mkdir -p ~/.claude
          jq -n --arg model "$ANTHROPIC_MODEL" \
            '{modelPicker: {options: [{model: $model, label: "OpenRouter free", behavesAs: "sonnet"}]}}' \
            > ~/.claude/settings.json

      - name: Install the life-science MCP server
        run: |
          git clone --depth 1 "$MCP_REPO" "$RUNNER_TEMP/biorouter"
          npm --prefix "$RUNNER_TEMP/biorouter" install --omit=dev --no-audit --no-fund
          jq -n --arg entry "$RUNNER_TEMP/biorouter/src/index.js" \
            '{mcpServers: {"life-science": {command: "node", args: [$entry]}}}' \
            > "$RUNNER_TEMP/mcp.json"

      - name: Run the hypothesis-engine skill
        run: |
          for attempt in 1 2 3; do
            echo "--- attempt $attempt: $TOPIC ---"
            if claude -p "/hypothesis-engine $TOPIC" \
                 --output-format stream-json --include-partial-messages --verbose \
                 --mcp-config "$RUNNER_TEMP/mcp.json" --strict-mcp-config \
                 --dangerously-skip-permissions \
                 | jq -j --unbuffered -f .github/stream.jq; then
              exit 0
            fi
            echo "::warning::attempt $attempt failed"
            sleep $((attempt * 20))
          done
          echo "::error::hypothesis-engine failed after 3 attempts"
          exit 1

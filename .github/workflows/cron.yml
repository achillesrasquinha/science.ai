name: cron

on:
  push:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  hello:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # Claude Code appends /v1/messages, so this must not end in /v1.
      ANTHROPIC_BASE_URL: https://openrouter.ai/api
      ANTHROPIC_AUTH_TOKEN: ${{ secrets.OPENROUTER_API_KEY }}
      ANTHROPIC_API_KEY: ''
      ANTHROPIC_MODEL: nvidia/nemotron-3-ultra-550b-a55b:free
      CLAUDE_CODE_MAX_CONTEXT_TOKENS: '1000000'
    steps:
      - name: Echo hello world
        run: echo "hello world"

      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code

      - name: Report Claude Code version
        run: claude --version

      - name: Verify the OpenRouter secret is present
        run: |
          if [ -z "$ANTHROPIC_AUTH_TOKEN" ]; then
            echo "::error::OPENROUTER_API_KEY secret is not set"
            exit 1
          fi

      - name: Map the OpenRouter model into Claude Code's catalog
        run: |
          mkdir -p ~/.claude
          jq -n --arg model "$ANTHROPIC_MODEL" '{
            modelPicker: {
              options: [
                { model: $model, label: "OpenRouter free", behavesAs: "sonnet" }
              ]
            }
          }' > ~/.claude/settings.json

      - name: Ask Claude Code via OpenRouter
        continue-on-error: true
        run: |
          set -o pipefail
          claude -p 'Reply with exactly one short sentence saying hello.' \
            --output-format stream-json --include-partial-messages --verbose \
            | jq -j --unbuffered -f .github/stream.jq

      - name: Install the life-science MCP server
        run: |
          git clone --depth 1 https://github.com/achillesrasquinha/biorouter.git "$RUNNER_TEMP/biorouter"
          npm --prefix "$RUNNER_TEMP/biorouter" install --omit=dev --no-audit --no-fund
          jq -n --arg entry "$RUNNER_TEMP/biorouter/src/index.js" \
            '{mcpServers: {"life-science": {command: "node", args: [$entry]}}}' \
            > "$RUNNER_TEMP/mcp.json"

      - name: Run the hypothesis-engine skill for systems biology
        run: |
          set -o pipefail
          ls -1 .claude/skills
          for attempt in 1 2 3; do
            echo "--- hypothesis-engine attempt $attempt ---"
            if claude -p '/hypothesis-engine systems biology' \
                 --output-format stream-json --include-partial-messages --verbose \
                 --mcp-config "$RUNNER_TEMP/mcp.json" --strict-mcp-config \
                 --dangerously-skip-permissions \
                 | jq -j --unbuffered -f .github/stream.jq; then
              exit 0
            fi
            echo "::warning::attempt $attempt failed"
            sleep $((attempt * 20))
          done
          echo "::error::hypothesis-engine failed after 3 attempts"
          exit 1
